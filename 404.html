<!DOCTYPE html>
<html lang="en">
<head>

  <title>404 — Hyaecord</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <style>
    :root { --amber: #c88633; --bg: #16130e; --text: #f1e9d5; --text-dim: #b3a98d; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f2e6; --text: #2b2416; --text-dim: #6d6350; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Cantarell, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 1.25rem; }
    h1 { font-size: 4rem; }
    p { color: var(--text-dim); margin: 0.5rem 0 1.5rem; }
    a { color: var(--amber); }
  </style>
</head>
